<!doctype html>
<html lang="vi" data-hub>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng tổng · Giả lập học tập Tài chính – Kế toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem('ltso-theme');}catch(e){}if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;})();
</script>
<script src="./nav.js"></script>
<style>
:root{
  --bg:#f4f5f9;--surface:#fff;--surface2:#eef0f6;--ink:#131a2c;--muted:#5a6380;--line:#dde2ee;
  --fin:#1d5cf0;--fin-soft:#e3ebff;--acc:#0f7a64;--acc-soft:#dcf2ec;--warn:#9a6a00;--warn-soft:#fff4d6;
  --shadow:0 1px 2px rgba(19,26,44,.05),0 6px 18px rgba(19,26,44,.05);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1e;--surface:#111a2e;--surface2:#17213a;--ink:#e7ebf7;--muted:#95a0bf;--line:#243150;
  --fin:#7aa2ff;--fin-soft:rgba(122,162,255,.14);--acc:#3fcf9f;--acc-soft:rgba(63,207,159,.13);--warn:#ffc94d;--warn-soft:rgba(255,201,77,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1e;--surface:#111a2e;--surface2:#17213a;--ink:#e7ebf7;--muted:#95a0bf;--line:#243150;
  --fin:#7aa2ff;--fin-soft:rgba(122,162,255,.14);--acc:#3fcf9f;--acc-soft:rgba(63,207,159,.13);--warn:#ffc94d;--warn-soft:rgba(255,201,77,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left))}
header{padding:28px 0 6px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
.sp{flex:1}
.ibtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}

/* Cấp 1: Tài chính | Kế toán */
.domains{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 0}
.dom{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 18px 15px;font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.dom:hover{border-color:var(--muted)}
.dom .dt{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.dom .di{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--surface2);color:var(--muted)}
.dom .dd{color:var(--muted);font-size:13px;margin-top:6px}
.dom .dc{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
.dom[aria-pressed="true"]{border-color:var(--c)}
.dom[aria-pressed="true"] .di{background:var(--c);color:#fff}
.dom[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--surface);border-right:1.5px solid var(--c);border-bottom:1.5px solid var(--c);transform:translateX(-50%) rotate(45deg)}
.dom.fin{--c:var(--fin)}.dom.acc{--c:var(--acc)}

/* Cấp 2: Học tập | Bài tập */
.panel{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.modes{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.modes button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px 14px 11px;border-bottom:2.5px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.modes .cnt{font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);border-radius:10px;padding:1px 7px}
.body{padding:18px 20px 22px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* Cấp 3: lộ trình */
.stage{margin-top:6px}
.stage+.stage{margin-top:22px}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sh h3{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.sh p{margin:0;color:var(--muted);font-size:12.5px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:36px 1fr;gap:14px;padding:4px 0}
.num{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--c);color:var(--c)}
.card{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c)}
.ct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:15.5px}
.ct .go{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--c);white-space:nowrap}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--warn-soft);color:var(--warn)}
.tag.k{background:var(--surface2);color:var(--muted)}
.cd{color:var(--muted);font-size:13.5px;margin:3px 0 0}
.parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;counter-reset:p}
.parts a,.parts span{counter-increment:p;font-size:12px;text-decoration:none;color:var(--ink);background:var(--surface2);border-radius:7px;padding:3px 8px}
.parts a::before,.parts span::before{content:counter(p) ". ";color:var(--muted)}
.parts a:hover{background:var(--c);color:#fff}.parts a:hover::before{color:inherit}

.ex{display:grid;gap:10px}
.ex .card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.ex .bn{font-weight:700;font-size:12px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:8px;padding:6px 8px;min-width:44px;text-align:center}
.ex .final{border-style:dashed}
.ex .go{font-size:12.5px;font-weight:600;color:var(--c);white-space:nowrap}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}

footer{color:var(--muted);font-size:12.5px;padding:22px 0 30px;text-align:center}
@media (max-width:620px){
  .domains{gap:8px}.dom{padding:13px 13px}.dom .dd{display:none}
  .body{padding:14px 14px 18px}.ex .card{grid-template-columns:auto 1fr}.ex .go{display:none}
  .ct .go{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo" aria-hidden="true">⌂</div>
      <div><h1>Bảng tổng</h1><div class="sub">Phòng giả lập học tập · Tài chính số và Kế toán</div></div>
      <div class="sp"></div>
      <button class="ibtn" id="themeBtn" type="button">Sáng/Tối</button>
    </div>
  </header>

  <div class="domains" id="domains" role="tablist" aria-label="Lĩnh vực"></div>

  <section class="panel" id="panel">
    <div class="modes" id="modes" role="tablist" aria-label="Học tập hoặc bài tập"></div>
    <div class="body" id="body"></div>
  </section>

  <footer>Chọn lĩnh vực, sau đó chọn Học tập để đi theo lộ trình hoặc Bài tập để luyện tập và kiểm tra.</footer>
</div>

<script>
(function(){
  'use strict';
  var MAP=window.SITE_MAP, N=window.SITE_NAV, esc=N.esc, abs=N.abs, flat=N.flat;
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var CLS={taichinh:'fin',ketoan:'acc'};
  var st={dom:'taichinh',mode:'hoc'};
  (function(){var m=(location.hash||'').match(/^#(taichinh|ketoan)(?:\/(hoc|bai))?$/);
    if(m){st.dom=m[1];st.mode=m[2]||'hoc';}else{st.dom=lsGet('gn-dom')||'taichinh';st.mode=lsGet('gn-mode')||'hoc';}
    if(!CLS[st.dom])st.dom='taichinh';if(st.mode!=='bai')st.mode='hoc';})();
  function D(){for(var i=0;i<MAP.length;i++)if(MAP[i].id===st.dom)return MAP[i];return MAP[0];}
  var $=function(id){return document.getElementById(id);};

  function href(it,k){var u=abs(it.href);
    if(k==null)return u.href;
    if(it.deep==='buoc')u.hash='#buoc'+(k+1);else if(it.deepIds)u.hash='#'+it.deepIds[k];else return null;return u.href;}

  function renderDomains(){
    $('domains').innerHTML=MAP.map(function(d){
      var nh=flat(d).length,nb=d.bai.length;
      return '<button class="dom '+CLS[d.id]+'" role="tab" data-dom="'+d.id+'" aria-pressed="'+(st.dom===d.id)+'" aria-selected="'+(st.dom===d.id)+'">'+
        '<div class="dt"><span class="di">'+esc(d.icon)+'</span>'+esc(d.label)+'</div>'+
        '<div class="dd">'+esc(d.desc)+'</div>'+
        '<div class="dc">'+nh+' bài học · '+nb+' bài tập</div></button>';
    }).join('');
  }
  function renderModes(){
    var d=D();
    $('panel').className='panel';$('panel').style.setProperty('--c','var(--'+CLS[d.id]+')');
    $('modes').innerHTML=
      '<button role="tab" data-mode="hoc" aria-selected="'+(st.mode==='hoc')+'">Học tập <span class="cnt">'+flat(d).length+'</span></button>'+
      '<button role="tab" data-mode="bai" aria-selected="'+(st.mode==='bai')+'">Bài tập <span class="cnt">'+d.bai.length+'</span></button>';
  }
  function renderBody(){
    var d=D(),h='';
    if(st.mode==='hoc'){
      h+='<p class="lead">Lộ trình '+esc(d.label.toLowerCase())+' gồm '+d.hoc.length+' chặng, sắp xếp từ đơn giản đến phức tạp. Bấm vào bài để mở; bấm vào từng mục nhỏ để vào thẳng phần đó.</p>';
      d.hoc.forEach(function(g){
        h+='<div class="stage"><div class="sh"><h3>'+esc(g.group)+'</h3>'+(g.note?'<p>'+esc(g.note)+'</p>':'')+'</div><ol class="path">';
        g.items.forEach(function(it){
          var parts=(it.parts||[]).map(function(p,k){var u=href(it,k);
            return u?'<a href="'+esc(u)+'">'+esc(p)+'</a>':'<span>'+esc(p)+'</span>';}).join('');
          var ex=d.bai.filter(function(b){return b.after===it.n;});
          h+='<li class="step"><div class="num">'+esc(it.n)+'</div><div>'+
            '<a class="card" href="'+esc(href(it))+'"><div class="ct">'+esc(it.t)+
              (it.login?'<span class="tag">Cần đăng nhập</span>':'')+
              (ex.length?'<span class="tag k">Có bài tập '+esc(ex.map(function(b){return b.n;}).join(', '))+'</span>':'')+
              '<span class="go">Mở bài →</span></div>'+
            '<p class="cd">'+esc(it.d)+'</p></a>'+
            (parts?'<div class="parts">'+parts+'</div>':'')+'</div></li>';
        });
        h+='</ol></div>';
      });
    }else{
      h+='<p class="lead">Làm mỗi phiếu sau khi học xong bài tương ứng. Phiếu bài tập tự chấm và in được; bài kiểm tra tổng hợp làm sau cùng.</p><div class="ex">';
      d.bai.forEach(function(it){
        h+='<a class="card'+(it.final?' final':'')+'" href="'+esc(href(it))+'"><span class="bn">'+esc(it.n)+'</span><div>'+
          '<div class="ct">'+esc(it.t)+(it.login?'<span class="tag">Cần đăng nhập</span>':'')+
          (it.after?'<span class="tag k">Sau bài '+esc(it.after)+'</span>':'')+(it.final?'<span class="tag k">Cuối học phần</span>':'')+'</div>'+
          '<p class="cd">'+esc(it.d)+'</p></div><span class="go">Làm bài →</span></a>';
      });
      h+='</div>';
      if(d.id==='ketoan')h+='<div class="empty">Bài 2 · Sổ cái doanh nghiệp chưa có phiếu bài tập riêng.</div>';
    }
    $('body').innerHTML=h;
  }
  function render(){renderDomains();renderModes();renderBody();
    try{history.replaceState(null,'','#'+st.dom+'/'+st.mode);}catch(e){}
    lsSet('gn-dom',st.dom);lsSet('gn-mode',st.mode);}
  $('domains').onclick=function(e){var b=e.target.closest('[data-dom]');if(!b)return;
    if(st.dom!==b.dataset.dom){st.dom=b.dataset.dom;st.mode='hoc';}render();};
  $('modes').onclick=function(e){var b=e.target.closest('[data-mode]');if(!b)return;st.mode=b.dataset.mode;render();};
  addEventListener('hashchange',function(){var m=(location.hash||'').match(/^#(taichinh|ketoan)(?:\/(hoc|bai))?$/);
    if(m&&(m[1]!==st.dom||(m[2]||'hoc')!==st.mode)){st.dom=m[1];st.mode=m[2]||'hoc';render();}});
  $('themeBtn').onclick=function(){var R=document.documentElement,c=R.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c==='dark'?'light':'dark';
    R.dataset.theme=n;lsSet('ltso-theme',n);};
  render();
})();
</script>
</body>
</html>
