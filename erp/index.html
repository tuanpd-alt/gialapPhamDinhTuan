<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ERP Lab HTTTKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky steel shell bar with T-code command field, left transaction menu, dense work area — an ERP workstation */
:root{
  --bg:#e8ecf0;--surface:#ffffff;--surface-2:#f3f5f8;--line:#d2d9e0;--line-2:#e4e9ee;
  --fg:#17222d;--muted:#596877;--shell:#1c3246;--shell-2:#28445e;--shell-fg:#e7eef4;--shell-mute:#a3b6c7;
  --accent:#1c6d88;--accent-fg:#ffffff;--accent-soft:#dbecf1;
  --ok:#27703a;--ok-soft:#e0f0e3;--warn:#935700;--warn-soft:#faefd8;--bad:#ad261d;--bad-soft:#f8e0dd;
  --paper:#fffdf8;--paper-line:#cfc8b8;
  --r-KHO:#9a6216;--r-MH:#14796e;--r-KD:#6a4fa3;--r-KT:#2d5fa8;--r-KTT:#a3324a;--r-GV:#4c5966;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --side-w:250px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d;--surface:#19212a;--surface-2:#1f2832;--line:#33414e;--line-2:#28333e;
  --fg:#e2e9ef;--muted:#93a4b3;--shell:#0b1218;--shell-2:#17232e;--shell-fg:#e2e9ef;--shell-mute:#8ea2b4;
  --accent:#5db2cf;--accent-fg:#0b1218;--accent-soft:#1b3440;
  --ok:#6cc583;--ok-soft:#173022;--warn:#e3a843;--warn-soft:#33270f;--bad:#f07c72;--bad-soft:#3a1c1a;
  --paper:#1d242b;--paper-line:#3d4853;
  --r-KHO:#e0a24c;--r-MH:#4fc4b5;--r-KD:#a98fe0;--r-KT:#79a6ec;--r-KTT:#ec7d94;--r-GV:#9aa8b5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d;--surface:#19212a;--surface-2:#1f2832;--line:#33414e;--line-2:#28333e;
  --fg:#e2e9ef;--muted:#93a4b3;--shell:#0b1218;--shell-2:#17232e;--shell-fg:#e2e9ef;--shell-mute:#8ea2b4;
  --accent:#5db2cf;--accent-fg:#0b1218;--accent-soft:#1b3440;
  --ok:#6cc583;--ok-soft:#173022;--warn:#e3a843;--warn-soft:#33270f;--bad:#f07c72;--bad-soft:#3a1c1a;
  --paper:#1d242b;--paper-line:#3d4853;
  --r-KHO:#e0a24c;--r-MH:#4fc4b5;--r-KD:#a98fe0;--r-KT:#79a6ec;--r-KTT:#ec7d94;--r-GV:#9aa8b5;
  color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num,code{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* shell */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--shell);color:var(--shell-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand small{font-weight:500;color:var(--shell-mute);font-size:12px}
.menu-btn{display:none;background:var(--shell-2);border:0;border-radius:6px;color:var(--shell-fg);padding:6px 10px;cursor:pointer}
.cmd{display:flex;align-items:center;background:var(--shell-2);border-radius:6px;padding:0 4px 0 10px;min-width:0;flex:0 1 240px}
.cmd span{color:var(--shell-mute);font-family:var(--f-mono);font-size:12px}
.cmd input{background:transparent;border:0;color:var(--shell-fg);font-family:var(--f-mono);padding:7px 6px;width:100%;min-width:0;text-transform:uppercase}
.cmd input::placeholder{color:var(--shell-mute);text-transform:none}
.cmd input:focus{outline:none}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto;font-size:13px}
.ctx select{background:var(--shell-2);border:0;border-radius:6px;color:var(--shell-fg);padding:5px 8px}
.ctx .who{color:var(--shell-mute)}
.ctx .who b{color:var(--shell-fg);font-weight:600}
.rolechip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--shell-2);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* layout */
.layout{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:calc(100vh - 52px)}
#side{border-right:1px solid var(--line);background:var(--surface);padding:14px 0 40px;font-size:13px}
#side h4{margin:16px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
#side h4:first-child{margin-top:0}
.mi{display:grid;grid-template-columns:62px 1fr auto;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:5px 16px;cursor:pointer;color:var(--fg)}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mi code{font-size:11.5px;color:var(--accent);font-weight:500}
.mi.locked{color:var(--muted)}
.mi.locked code{color:var(--muted)}
.mi .lk{font-size:10px;color:var(--muted)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:600;font-family:var(--f-mono)}
#main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;min-width:0}
.wrap{max-width:1180px;display:flex;flex-direction:column;gap:18px}

/* page head */
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.ph .tc{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500;letter-spacing:.04em}
.ph h1{font-size:22px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted);max-width:72ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel>h2{font-size:15px;font-weight:600;margin-bottom:10px}
.sec-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{padding:10px 12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.ok{background:var(--ok-soft);border-color:transparent}
.note.bad b,.err b{color:var(--bad)}
.err{background:var(--bad-soft);border-radius:6px;padding:10px 12px;font-size:13px}
.err:empty{display:none}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--accent-soft)}
.t th.num{text-align:right}
.t input,.t select{width:100%;min-width:90px}
.t .w-mat{min-width:220px}
.t input[type=checkbox]{width:auto;min-width:0;margin:0 6px 0 0;vertical-align:-2px}
form[data-form="EXTRA"] label{display:flex;align-items:baseline;gap:4px;font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* status */
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-pending{background:var(--warn-soft);color:var(--warn)}
.c-approved,.c-posted{background:var(--ok-soft);color:var(--ok)}
.c-rejected{background:var(--bad-soft);color:var(--bad)}
.c-blocked{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--accent-soft);color:var(--accent)}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select,.field textarea,.t input,.t select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--fg);font-size:13.5px}
.field input[readonly]{background:var(--surface-2)}
.t input.num{font-family:var(--f-mono)}
.form-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:4px}
.sum{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px}
.sum b{font-family:var(--f-mono);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.badb{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:inherit}

/* launchpad */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-height:110px}
.tile:hover{border-color:var(--accent)}
.tile .n{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1}
.tile .n.zero{color:var(--muted)}
.tile .l{font-weight:600;font-size:13.5px}
.tile code{font-size:11px;color:var(--accent);margin-top:auto}

/* process map */
.flowmap{display:flex;flex-direction:column;gap:14px}
.lane{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:0 0 132px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;border-top:3px solid var(--rc)}
.step.mine{box-shadow:0 0 0 2px var(--rc)}
.step code{font-size:11px;color:var(--muted)}
.step .s{font-weight:600;font-size:12.5px;line-height:1.3}
.step .r{font-size:11px;color:var(--rc);font-weight:600}
.step .q{position:absolute;top:6px;right:8px;font-family:var(--f-mono);font-size:12px;font-weight:500}
.step .q.has{color:var(--bad)}
.arrow{flex:0 0 18px;align-self:center;text-align:center;color:var(--muted)}
.lane-l{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* voucher */
.voucher{background:var(--paper);border:1px solid var(--paper-line);padding:22px;border-radius:4px;max-width:820px;font-size:13px}
.v-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px}
.v-title{text-align:center;margin:14px 0 2px;font-size:18px;font-weight:700;letter-spacing:.04em}
.v-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.voucher table{border-collapse:collapse;width:100%;margin:10px 0}
.voucher th,.voucher td{border:1px solid var(--paper-line);padding:5px 7px;font-size:12.5px}
.voucher th{font-weight:600;background:transparent}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px;text-align:center;font-size:12px}
.signs b{display:block}
.signs .sg{margin-top:8px;min-height:40px;font-size:11.5px;color:var(--ok)}
.signs .sg.none{color:var(--muted)}
details.vbox>summary{cursor:pointer;font-weight:600;padding:4px 0}

/* doc flow */
.tree{list-style:none;margin:0;padding:0;font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line);margin-left:7px}
.tree li{padding:3px 0}
.tree .node{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.tree .cur{background:var(--accent-soft);border-radius:4px;padding:0 6px}

/* hist */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{display:grid;grid-template-columns:130px 1fr;gap:10px}
.hist time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.hi{background:var(--bad)}
.bar i.mid{background:var(--warn)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--shell);color:var(--shell-fg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:min(420px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
.boot{max-width:560px;margin:60px auto;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #side{display:none;border-right:0;border-bottom:1px solid var(--line)}
  #side.open{display:block}
  .menu-btn{display:inline-block}
  .ctx{margin-left:0;width:100%}
  .cmd{flex:1 1 160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="shell">
  <button class="menu-btn" data-act="menu" aria-label="Mở menu giao dịch">☰ Menu</button>
  <div class="brand">ERP Lab <small>HTTTKT · TT99/2025</small></div>
  <form class="cmd" id="cmdform" autocomplete="off"><span>/n</span><input id="cmd" placeholder="Nhập mã giao dịch, ví dụ ME21N" aria-label="Mã giao dịch"></form>
  <div class="ctx" id="ctx"></div>
</header>
<div class="layout">
  <nav id="side" aria-label="Menu giao dịch"></nav>
  <main id="main"><div class="boot">Đang tải…</div></main>
</div>
<div id="toast" hidden></div>
<a id="dl" hidden></a>
<script src="config.js"></script>
<script>
"use strict";
/* ============ MASTER DATA (giống nhau cho cả 8 công ty) ============ */
const VAT = 0.10;
const YY = String(new Date().getFullYear()).slice(2);
const COS = ['C01','C02','C03','C04','C05','C06','C07','C08'];
const coName = c => 'Công ty CP Thương mại Cánh Buồm ' + c.slice(1);
const MATS = [
  {c:'HH01',n:'Laptop văn phòng 14 inch',u:'Cái',oq:20,oc:18500000,bp:18500000,sp:23900000},
  {c:'HH02',n:'Màn hình 24 inch IPS',u:'Cái',oq:40,oc:2600000,bp:2600000,sp:3450000},
  {c:'HH03',n:'Máy in laser A4',u:'Cái',oq:15,oc:3900000,bp:3900000,sp:4990000},
  {c:'HH04',n:'Chuột không dây',u:'Cái',oq:100,oc:290000,bp:290000,sp:420000},
  {c:'HH05',n:'Bàn phím cơ',u:'Cái',oq:50,oc:950000,bp:950000,sp:1290000}
];
const VENDORS = [
  {c:'NCC01',n:'Công ty TNHH Phân phối Tin học Sao Mai',mst:'4201234567',f:1.00,terms:30},
  {c:'NCC02',n:'Công ty CP Thiết bị Văn phòng Hải Âu',mst:'0312345678',f:0.97,terms:15},
  {c:'NCC03',n:'Công ty TNHH Linh kiện Bến Thành',mst:'0309876543',f:1.03,terms:45}
];
const CUSTS = [
  {c:'KH01',n:'Công ty TNHH Du lịch Biển Xanh',mst:'4201112223',lim:300000000,terms:30},
  {c:'KH02',n:'Công ty CP Thủy sản Hòn Tre',mst:'4203334445',lim:500000000,terms:30},
  {c:'KH03',n:'Cửa hàng Tin học Phước Hải',mst:'4205556667',lim:150000000,terms:15}
];
const ACCS = {
  '1111':'Tiền Việt Nam (tiền mặt)','1121':'Tiền gửi không kỳ hạn – VND','131':'Phải thu của khách hàng',
  '1331':'Thuế GTGT được khấu trừ của hàng hóa, dịch vụ','1561':'Giá mua hàng hóa','331':'Phải trả cho người bán',
  '33311':'Thuế GTGT đầu ra','411':'Vốn đầu tư của chủ sở hữu','5111':'Doanh thu bán hàng hóa','632':'Giá vốn hàng bán'
};
const INV0 = MATS.reduce((s,m)=>s+m.oq*m.oc,0);
const OPEN = {'1111':200000000,'1121':3000000000,'1561':INV0,'411':-(3200000000+INV0)};
const mat = c => MATS.find(m=>m.c===c);
const ven = c => VENDORS.find(v=>v.c===c);
const cus = c => CUSTS.find(v=>v.c===c);

const ROLES = {
  KHO:{n:'Thủ kho',d:'Lập đề nghị mua, nhập kho theo đơn mua, xuất kho giao hàng'},
  MH:{n:'Nhân viên mua hàng',d:'Chọn nhà cung cấp, lập đơn mua hàng'},
  KD:{n:'Nhân viên kinh doanh',d:'Nhận và lập đơn bán hàng'},
  KT:{n:'Kế toán công nợ',d:'Kiểm tra hóa đơn mua, đề nghị chi, lập hóa đơn bán, ghi nhận thu tiền'},
  KTT:{n:'Kế toán trưởng',d:'Phê duyệt đề nghị mua, đơn mua, tín dụng, hóa đơn bị khóa, phiếu chi/thu'}
};
const ROLE_ORDER = ['KHO','MH','KD','KT','KTT'];
const roleName = r => r==='GV' ? 'Giảng viên (toàn quyền)' : (ROLES[r]?ROLES[r].n:'—');

const TYPES = {
  PR:{n:'Đề nghị mua hàng',pre:'100000',tc:'ME51N'},
  PO:{n:'Đơn mua hàng',pre:'450000',tc:'ME21N'},
  GR:{n:'Phiếu nhập kho',pre:'500000',tc:'MIGO'},
  IV:{n:'Hóa đơn mua vào',pre:'510000',tc:'MIRO'},
  PAY:{n:'Phiếu chi / Ủy nhiệm chi',pre:'150000',tc:'F-53'},
  SO:{n:'Đơn bán hàng',pre:'000010',tc:'VA01'},
  DL:{n:'Phiếu xuất kho',pre:'800000',tc:'VL01N'},
  BI:{n:'Hóa đơn GTGT bán ra',pre:'900000',tc:'VF01'},
  RC:{n:'Phiếu thu / Giấy báo Có',pre:'140000',tc:'F-28'}
};
const ALL = 'ALL';
const TC = {

function docSo(n){
  n=Math.round(Math.abs(n)); if(n===0) return 'Không đồng';
  const cs=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const r3=(x,full)=>{const tr=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10,s=[];
    if(full||tr>0) s.push(cs[tr]+' trăm');
    if(ch===0){ if(dv>0&&(full||tr>0)) s.push('lẻ'); }
    else if(ch===1) s.push('mười'); else s.push(cs[ch]+' mươi');
    if(dv>0){ if(dv===1&&ch>1) s.push('mốt'); else if(dv===5&&ch>0) s.push('lăm'); else s.push(cs[dv]); }
    return s.join(' ');};
  const u=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ']; const g=[];
  while(n>0){g.push(n%1000);n=Math.floor(n/1000);}
  const out=[]; for(let i=g.length-1;i>=0;i--){ if(g[i]===0) continue; out.push(r3(g[i],i<g.length-1)+(u[i]?' '+u[i]:'')); }
  const s=out.join(' ').replace(/\s+/g,' ').trim(); return s.charAt(0).toUpperCase()+s.slice(1)+' đồng.';
}

const memo = {};
function calc(co){
  const v = S.ver[co]||0;
  if(memo[co] && memo[co].v===v) return memo[co].c;
  const D = S.docs[co]||{};
  const L = Object.keys(D).map(id=>Object.assign({id},D[id]));
  L.sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));
  const T = {}; Object.keys(TYPES).forEach(t=>T[t]=[]);
  L.forEach(d=>{ if(T[d.type]) T[d.type].push(d); });
  const live = d => d.status!=='rejected';
  const by = {}; L.forEach(d=>by[d.id]=d);
  const kids = (t,f,id) => T[t].filter(x=>x[f]===id&&live(x));

  const st = {}; MATS.forEach(m=>st[m.c]={oq:m.oq,ov:m.oq*m.oc,iq:0,xq:0,v:m.oq*m.oc,mv:[]});
  T.GR.filter(live).forEach(g=>g.items.forEach(it=>{st[it.mat].iq+=it.qty; st[it.mat].mv.push({d:g,q:it.qty});}));
  T.DL.filter(live).forEach(g=>g.items.forEach(it=>{st[it.mat].xq+=it.qty; st[it.mat].mv.push({d:g,q:-it.qty});}));

  const acc = {}; Object.keys(ACCS).forEach(a=>acc[a]={o:OPEN[a]||0,dr:0,cr:0});
  const ap = {}, ar = {}; VENDORS.forEach(x=>ap[x.c]={dr:0,cr:0}); CUSTS.forEach(x=>ar[x.c]={dr:0,cr:0});
  const lines = [];
  L.forEach(d=>{ if(!live(d)||!Array.isArray(d.je)) return; d.je.forEach(j=>{
    const a=acc[j.a]; if(!a) return; a.dr+=j.dr||0; a.cr+=j.cr||0;
    if(j.a==='1561'&&j.mat&&st[j.mat]) st[j.mat].v+=(j.dr||0)-(j.cr||0);
    if(j.a==='331'&&ap[j.p]){ap[j.p].dr+=j.dr||0;ap[j.p].cr+=j.cr||0;}
    if(j.a==='131'&&ar[j.p]){ar[j.p].dr+=j.dr||0;ar[j.p].cr+=j.cr||0;}
    lines.push({d,j}); }); });
  MATS.forEach(m=>{const s=st[m.c]; s.q=s.oq+s.iq-s.xq; s.avg=s.q>0?s.v/s.q:m.oc;});
  const bal = a => acc[a].o+acc[a].dr-acc[a].cr;

  // P2P open quantities
  const poOpen = po => po.items.map((it,i)=>it.qty-sum(kids('GR','po',po.id),g=>sum(g.items.filter(x=>x.line===i),x=>x.qty)));
  const poUninv = po => po.items.map((it,i)=>sum(kids('GR','po',po.id),g=>sum(g.items.filter(x=>x.line===i),x=>x.qty))-sum(kids('IV','po',po.id),g=>sum(g.items.filter(x=>x.line===i),x=>x.qty)));
  const ivPaid = iv => sum(T.PAY.filter(p=>p.iv===iv.id&&p.status==='posted'),p=>p.amount);
  const ivPend = iv => sum(T.PAY.filter(p=>p.iv===iv.id&&p.status==='pending'),p=>p.amount);
  // O2C
  const soDeliv = so => so.items.map((it,i)=>sum(kids('DL','so',so.id),g=>sum(g.items.filter(x=>x.line===i),x=>x.qty)));
  const soOpen = so => { const dv=soDeliv(so); return so.items.map((it,i)=>it.qty-dv[i]); };
  const soBilled = so => so.items.map((it,i)=>sum(kids('BI','so',so.id),g=>sum(g.items.filter(x=>x.line===i),x=>x.qty)));
  const biPaid = bi => sum(T.RC.filter(p=>p.bi===bi.id&&p.status==='posted'),p=>p.amount);
  const biPend = bi => sum(T.RC.filter(p=>p.bi===bi.id&&p.status==='pending'),p=>p.amount);
  const exposure = c => { const arb=ar[c].dr-ar[c].cr; const openSO=sum(T.SO.filter(s=>s.cust===c&&s.status==='approved'),s=>{const b=soBilled(s);return sum(s.items.map((it,i)=>(it.qty-b[i])*it.price*(1+VAT)));}); return {ar:Math.round(arb),so:Math.round(openSO),tot:Math.round(arb+openSO)}; };

  const Q = {
    prForPO: T.PR.filter(p=>p.status==='approved'&&kids('PO','pr',p.id).length===0),
    poForGR: T.PO.filter(p=>p.status==='approved'&&poOpen(p).some(q=>q>0)),
    poForIV: T.PO.filter(p=>p.status==='approved'&&poUninv(p).some(q=>q>0)),
    ivForPay: T.IV.filter(i=>i.status==='posted'&&i.total-ivPaid(i)-ivPend(i)>0.5),
    soForDL: T.SO.filter(s=>s.status==='approved'&&soOpen(s).some(q=>q>0)),
    dlForBI: T.DL.filter(d=>d.status==='posted'&&kids('BI','dl',d.id).length===0),
    biForRC: T.BI.filter(b=>b.status==='posted'&&b.total-biPaid(b)-biPend(b)>0.5),
    ap: {PR:T.PR.filter(x=>x.status==='pending'),PO:T.PO.filter(x=>x.status==='pending'),IV:T.IV.filter(x=>x.status==='blocked'),
         SO:T.SO.filter(x=>x.status==='blocked'),PAY:T.PAY.filter(x=>x.status==='pending'),RC:T.RC.filter(x=>x.status==='pending')}
  };
  Q.apAll = [].concat(Q.ap.PR,Q.ap.PO,Q.ap.IV,Q.ap.SO,Q.ap.PAY,Q.ap.RC);
  const c = {L,T,by,kids,st,acc,ap,ar,lines,bal,poOpen,poUninv,ivPaid,ivPend,soOpen,soDeliv,soBilled,biPaid,biPend,exposure,Q};
  memo[co] = {v,c}; return c;
}

/* ============ API (Supabase RPC) ============ */
async function api(fn,args){
  let res;
  try{
    res = await fetch(CFG.supabaseUrl.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':CFG.supabaseAnonKey,'Authorization':'Bearer '+CFG.supabaseAnonKey},
      body:JSON.stringify(args||{})});
  }catch(e){ const er=new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); er.code='net'; throw er; }
  const txt = await res.text(); let j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
  if(!res.ok){ const er=new Error((j&&j.message)||('Lỗi máy chủ '+res.status)); er.code=j&&j.code; er.status=res.status; throw er; }
  return j;
}

/* ============ AUTHORIZATION ============ */
const TC_DOC = {'ME51N':'PR','ME21N':'PO','MIGO':'GR','MIRO':'IV','F-53':'PAY','VA01':'SO','VL01N':'DL','VF01':'BI','F-28':'RC'};
const TYPE_ROLE = {PR:'KHO',GR:'KHO',DL:'KHO',PO:'MH',SO:'KD',IV:'KT',PAY:'KT',BI:'KT',RC:'KT'};
const GRANTS = ['PR','PO','GR','IV','PAY','SO','DL','BI','RC','AP'];
const grantName = g => g==='AP' ? 'Phê duyệt chứng từ' : TYPES[g].n+' ('+TYPES[g].tc+')';
// Mức xung đột khi một người giữ cả hai vai trò (0 = chấp nhận được, 3 = nghiêm trọng)
const CONFLICT = {'KHO|MH':2,'KHO|KT':3,'KHO|KD':1,'MH|KT':2,'KD|KT':2,'MH|KD':0,'KHO|KTT':3,'MH|KTT':3,'KD|KTT':3,'KT|KTT':3};
const conflictOf = (a,b) => CONFLICT[a+'|'+b] ?? CONFLICT[b+'|'+a] ?? 0;
const CONFLICT_WHY = {'KHO|MH':'tự đặt mua và tự nhận hàng','KHO|KT':'vừa giữ hàng vừa ghi sổ','KHO|KD':'vừa bán vừa xuất kho','MH|KT':'vừa đặt mua vừa ghi nhận công nợ phải trả','KD|KT':'vừa bán vừa lập hóa đơn, thu tiền','KHO|KTT':'vừa lập vừa duyệt chứng từ kho','MH|KTT':'vừa lập vừa duyệt đơn mua','KD|KTT':'vừa bán vừa gỡ khóa tín dụng','KT|KTT':'vừa lập vừa duyệt phiếu chi, phiếu thu'};
const conflictWhy = (a,b) => CONFLICT_WHY[a+'|'+b] || CONFLICT_WHY[b+'|'+a] || '';
function userRoles(u){ if(!u||!u.role) return []; return [u.role].concat((u.extra||[]).filter(x=>ROLES[x]&&x!==u.role)); }
function userGrants(u){ return ((u&&u.extra)||[]).filter(x=>x.startsWith('T:')).map(x=>x.slice(2)); }
function myRoles(){ if(S.isAdmin) return S.role==='GV'?ROLE_ORDER.slice():[S.role]; return userRoles(S.me); }
function myGrants(){ return S.isAdmin?[]:userGrants(S.me); }
function canApprove(){ return myRoles().includes('KTT') || myGrants().includes('AP'); }
function allowed(tc){
  const t = TC[tc]; if(!t) return false;
  if(t.admin) return S.isAdmin;
  if(S.role==='GV') return true;
  if(t.r===ALL) return true;
  if('ap' in t) return canApprove();
  const dt = TC_DOC[tc];
  if(dt) return myRoles().includes(TYPE_ROLE[dt]) || myGrants().includes(dt);
  const rs = myRoles();
  return Array.isArray(t.r)&&t.r.some(r=>rs.includes(r));
}
function rolesLabel(u){ const rs=userRoles(u); if(!rs.length) return '—'; const g=userGrants(u);
  return roleName(rs[0]) + (rs.length>1?' · kiêm '+rs.slice(1).map(roleName).join(', '):'') + (g.length?' · được giao: '+g.map(x=>x==='AP'?'phê duyệt':TYPES[x].tc).join(', '):''); }
function userConflicts(u){ const rs=userRoles(u), out=[]; for(let i=0;i<rs.length;i++) for(let j=i+1;j<rs.length;j++){ const sc=conflictOf(rs[i],rs[j]); if(sc>=2) out.push({a:rs[i],b:rs[j],sc}); } return out; }
function rolesFor(tc){ const t=TC[tc]; if(!t) return ''; if(t.admin) return 'Giảng viên'; if(t.r===ALL) return 'Tất cả'; return t.r.map(roleName).join(', '); }

function ctxResolve(){
  if(S.isAdmin){
    const c=LS.get('erp.co'); S.co = c&&COS.includes(c) ? c : (S.co||'C01');
    const r = LS.get('erp.role'); S.role = (r&&(r==='GV'||ROLES[r]))?r:'GV';
  } else {
    S.co = S.me&&S.me.co||null; S.role = S.me&&S.me.role||null;
  }
}
let syncing=null;
async function sync(full){
  while(syncing){ try{ await syncing; }catch(e){} }
  syncing = (async()=>{
    const r = await api('erp_sync',{p_token:S.token,p_co:'*',p_since:full?null:S.since});
    const before = S.me?JSON.stringify([S.me.co,S.me.role]):null;
    S.me=r.me; S.uid=r.me.id; S.isAdmin=!!r.me.is_admin;
    const users={}; (r.users||[]).forEach(u=>users[u.id]=u);
    const meta=JSON.stringify([r.me,r.cfg,r.users]);
    let changed=false;
    if(meta!==S.metaKey){ S.metaKey=meta; S.users=users; S.cfg=Object.assign({tol:5,poAuto:0,credit:true},r.cfg||{}); S.sideKey=''; changed=true; }
    const ep=r.epochs||{}; let reset=false;
    COS.forEach(co=>{ if((S.epochs[co]||0)!==(ep[co]||0)){ reset=true; } });
    S.epochs=ep;
    if(full){ S.docs={}; COS.forEach(co=>S.ver[co]=(S.ver[co]||0)+1); changed=true; }
    (r.docs||[]).forEach(x=>{ const m=(S.docs[x.co]=S.docs[x.co]||{}); const old=m[x.id];
      if(!old||JSON.stringify(old)!==JSON.stringify(x.data)){ m[x.id]=x.data; S.ver[x.co]=(S.ver[x.co]||0)+1; changed=true; } });
    S.since=r.now;
    ctxResolve();
    if(!S.isAdmin && before && before!==JSON.stringify([S.me.co,S.me.role])){ S.docs={}; S.since=null; S.screen='HOME'; S.param=null; S.sideKey=''; syncing=null; await sync(true); render(true); return; }
    if(reset&&!full){ S.since=null; syncing=null; await sync(true); return; }
    if(changed) schedule();
  })();
  try{ await syncing; } finally { syncing=null; }
}
function startPolling(){
  clearTimeout(S.timer);
  const tick = async()=>{
    try{ await sync(); setOnline(true); }
    catch(e){ if(e.code==='28000'){ logout(); return; } setOnline(false); }
    S.timer=setTimeout(tick, document.hidden?30000:5000);
  };
  S.timer=setTimeout(tick,5000);
}

let rt=null; function schedule(){ if(rt) return; rt=requestAnimationFrame(()=>{rt=null;render(false);}); }

/* ============ RENDER ============ */
const LIVE_FORM = {'ME51N':1,'VA01':1};
function isFormScreen(){
  if(S.me&&S.me.must_change) return true;
  if(LIVE_FORM[S.screen]) return true;
  if(['ME21N','MIGO','MIRO','F-53','VL01N','VF01','F-28'].includes(S.screen)&&S.param) return true;
  if(S.screen==='SPRO'||S.screen==='PW') return true;
  if(S.screen==='SU01'&&S.editExtra) return true;
  return false;
}
function render(force,keepScroll){
  ctxResolve();
  renderCtx(); renderSide();
  if(!force && isFormScreen()) return;
  const main = document.getElementById('main');
  const y = window.scrollY;
  let html;
  try{ html = screenHTML(); }catch(e){ console.error(e); html = `<div class="wrap"><div class="err"><b>Lỗi hiển thị:</b> ${esc(e.message)}</div></div>`; }
  main.innerHTML = html;
  if(!force||keepScroll) window.scrollTo(0,y);
  const f = main.querySelector('form[data-calc]'); if(f&&CALC[f.dataset.calc]) CALC[f.dataset.calc](f);
}
function renderCtx(){
  const el = document.getElementById('ctx');
  if(!S.me){ el.innerHTML=''; el.dataset.k=''; return; }
  let h='';
  if(S.isAdmin){
    h += `<select id="sel-co" data-chg="co" aria-label="Công ty">${COS.map(c=>`<option value="${c}" ${c===S.co?'selected':''}>${c} · Nhóm ${+c.slice(1)}</option>`).join('')}</select>`;
    h += `<select id="sel-role" data-chg="role" aria-label="Thao tác với vai trò">${['GV',...ROLE_ORDER].map(r=>`<option value="${r}" ${r===S.role?'selected':''}>${r==='GV'?'Giảng viên – toàn quyền':'Thao tác như: '+ROLES[r].n}</option>`).join('')}</select>`;
  } else if(S.co){
    const xr=myRoles().slice(1), xg=myGrants();
    h += `<span class="rolechip"><span class="dot" style="background:var(--r-${S.role})"></span>${esc(roleName(S.role))}${xr.length||xg.length?` <span style="font-weight:500;color:var(--shell-mute)">+ kiêm ${xr.length+xg.length}</span>`:''}</span><span class="who">${esc(S.co)} · ${esc(coName(S.co))}</span>`;
  }
  h += `<span class="who"><b>${esc(S.me.full_name)}</b> <span class="mono">${esc(S.me.username)}</span></span>`;
  if(!S.online) h += `<span class="rolechip" style="background:var(--bad)">Mất kết nối</span>`;
  h += `<button class="btn sm" data-go="PW" style="background:var(--shell-2);color:var(--shell-fg);border-color:transparent">Đổi mật khẩu</button><button class="btn sm" data-act="logout" style="background:var(--shell-2);color:var(--shell-fg);border-color:transparent">Đăng xuất</button>`;
  if(el.dataset.k!==h){ el.innerHTML=h; el.dataset.k=h; }
}
function renderSide(){
  const side = document.getElementById('side');
  if(!S.me){ side.innerHTML=''; S.sideKey=''; return; }
  if(!S.co && !S.isAdmin){ if(S.sideKey!=='none'){ side.innerHTML='<h4>Chưa được phân quyền</h4><p class="small muted" style="padding:0 16px">Menu giao dịch sẽ hiện sau khi giảng viên gán bạn vào công ty và vai trò.</p>'; S.sideKey='none'; } return; }
  const c = calc(S.co);
  const cnt = {'ME21N':c.Q.prForPO.length,'MIGO':c.Q.poForGR.length,'MIRO':c.Q.poForIV.length,'F-53':c.Q.ivForPay.length,'VL01N':c.Q.soForDL.length,'VF01':c.Q.dlForBI.length,'F-28':c.Q.biForRC.length,
    'SBWP':c.Q.apAll.length,'ME54N':c.Q.ap.PR.length,'ME29N':c.Q.ap.PO.length,'MRBR':c.Q.ap.IV.length,'VKM3':c.Q.ap.SO.length,'ZFAP':c.Q.ap.PAY.length+c.Q.ap.RC.length};
  const groups = {};
  Object.keys(TC).forEach(k=>{ const t=TC[k]; if(t.admin&&!S.isAdmin) return; (groups[t.m]=groups[t.m]||[]).push(k); });
  let h = `<button class="mi ${S.screen==='HOME'?'on':''}" data-go="HOME"><code>HOME</code><span>Trang làm việc</span><span></span></button>`;
  Object.keys(groups).forEach(g=>{
    h += `<h4>${esc(g)}</h4>`;
    groups[g].forEach(k=>{ const ok=allowed(k); const n=ok?cnt[k]:0;
      h += `<button class="mi ${S.screen===k?'on':''} ${ok?'':'locked'}" data-go="${k}" title="${ok?'':'Không có quyền – vai trò được phép: '+esc(rolesFor(k))}"><code>${k}</code><span>${esc(TC[k].t)}</span>${n?`<span class="badge">${n}</span>`:(ok?'<span></span>':'<span class="lk">khóa</span>')}</button>`; });
  });
  const key = h;
  if(S.sideKey!==key){ side.innerHTML=h; S.sideKey=key; }
}
function go(tc,param){
  tc = String(tc||'').toUpperCase().trim();
  if(tc!=='HOME'&&tc!=='DOC'&&tc!=='PW'&&!TC[tc]){ toast('Mã giao dịch '+tc+' không tồn tại.'); return; }
  S.stack.push({s:S.screen,p:S.param});
  S.screen=tc; S.param=param||null;
  document.getElementById('side').classList.remove('open');
  render(true); window.scrollTo(0,0);
}
function back(){ const b=S.stack.pop(); if(b){S.screen=b.s;S.param=b.p;} else {S.screen='HOME';S.param=null;} render(true); window.scrollTo(0,0); }

function head(tc,title,desc,acts){
  return `<div class="ph"><div><div class="tc">${esc(tc)}</div><h1>${esc(title)}</h1>${desc?`<p>${desc}</p>`:''}</div><div class="acts">${acts||''}<button class="btn sm" data-act="back">← Quay lại</button></div></div>`;
}

function screenHTML(){
  if(S.me&&S.me.must_change) return scrPW(true);
  if(S.screen==='PW') return scrPW(false);
  if(!S.isAdmin && !S.co){ return scrWaiting(); }
  const s = S.screen;
  if(s==='HOME') return scrHome();
  if(s==='DOC') return scrDoc();
  if(TC[s] && !allowed(s)) return scrNoAuth(s);
  const F = {'ME51N':scrPR,'ME21N':scrPO,'MIGO':scrGR,'MIRO':scrIV,'F-53':scrPAY,'VA01':scrSO,'VL01N':scrDL,'VF01':scrBI,'F-28':scrRC,
    'MMBE':scrStock,'FBL1N':scrAP,'FBL5N':scrAR,'ZNKC':scrNKC,'F.01':scrTB,'ZCASE':scrCase,'PFCG':scrPFCG,'SU01':scrUsers,'ZOVR':scrOverview,'SPRO':scrConfig};
  if(F[s]) return F[s]();
  if(TC[s]&&TC[s].list) return scrList(s);
  if(TC[s]&&'ap' in TC[s]) return scrInbox(s);
  return scrHome();
}

function lane(steps,c){
  return `<div class="lane">${steps.map((s,i)=>{ const q=s[3](c); const mine=S.role!=='GV'&&(myRoles().includes(s[1])||(s[1]==='KTT'&&canApprove()));

function matOpts(sel,co){ const c=calc(co); return MATS.map(m=>`<option value="${m.c}" ${m.c===sel?'selected':''}>${m.c} · ${esc(m.n)} (tồn ${c.st[m.c].q})</option>`).join(''); }
function lineRow(kind,co){
  const m = MATS[0];
  return `<tr><td><select class="li-mat w-mat" data-chg="linemat" aria-label="Hàng hóa">${matOpts(m.c,co)}</select></td>

  <td class="num li-amt"></td><td><button type="button" class="btn sm" data-act="delLine" aria-label="Xóa dòng">✕</button></td></tr>`;

function lineTable(kind,co){
  return `<div class="tw"><table class="t"><thead><tr><th>Hàng hóa</th><th class="num">Số lượng</th><th class="num">${kind==='SO'?'Đơn giá bán (chưa VAT)':'Giá tham khảo'}</th><th class="num">${kind==='SO'?'Thành tiền':'Giá trị ước tính'}</th><th></th></tr></thead><tbody id="lines">${lineRow(kind,co)}</tbody></table></div>

function readLines(f,kind){
  return [...f.querySelectorAll('#lines tr')].map(tr=>({mat:tr.querySelector('.li-mat').value,qty:Math.round(num(tr.querySelector('.li-qty').value)),
    price:kind==='SO'?Math.round(num(tr.querySelector('.li-price').value)):undefined}));
}
function setErr(f,msg){ const e=f.querySelector('.err'); if(e){ e.innerHTML=msg; if(msg) e.scrollIntoView({block:'nearest'}); } }
function pickTable(rows,cols){
  if(!rows.length) return `<div class="tw"><div class="empty">Không có chứng từ nào đang chờ ở bước này.</div></div>`;
  return `<div class="tw"><table class="t"><thead><tr>${cols.map(c=>`<th class="${c.n?'num':''}">${c.h}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'num':''}">${c.f(r)}</td>`).join('')}<td>${r.__act||''}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ============ DOCUMENT DETAIL ============ */
function parentOf(c,d){ const f={PO:'pr',GR:'po',IV:'po',PAY:'iv',DL:'so',BI:'dl',RC:'bi'}[d.type]; return f?c.by[d[f]]:null; }
function childrenOf(c,d){ const m={PR:[['PO','pr']],PO:[['GR','po'],['IV','po']],IV:[['PAY','iv']],SO:[['DL','so']],DL:[['BI','dl']],BI:[['RC','bi']]}[d.type]||[];
  return [].concat(...m.map(([t,f])=>c.T[t].filter(x=>x[f]===d.id))); }
function flowTree(c,cur){
  let root=cur; for(let i=0;i<6;i++){ const p=parentOf(c,root); if(!p) break; root=p; }
  const node = d => `<li><span class="node ${d.id===cur.id?'cur':''}">${docLink(S.param.co,d)} <span class="small">${esc(TYPES[d.type].n)}</span> ${chip(d)} <span class="small muted">${vd(d.date)} · ${fm(valueOf(d))}</span></span>${(()=>{const k=childrenOf(c,d);return k.length?`<ul>${k.map(node).join('')}</ul>`:'';})()}</li>`;
  return `<ul class="tree">${node(root)}</ul>`;
}
function itemsTable(d){
  const cols = {PR:['SL','Giá tham khảo'],PO:['SL','Đơn giá'],GR:['SL nhập','Giá tạm tính'],IV:['SL','Đơn giá HĐ'],SO:['SL','Đơn giá'],DL:['SL xuất','Giá vốn BQ'],BI:['SL','Đơn giá']}[d.type];
  if(!cols||!d.items) return '';
  const price = it => d.type==='PR'?mat(it.mat).bp : d.type==='DL'?(it.cost/it.qty) : it.price;
  return `<div class="tw"><table class="t"><thead><tr><th>Hàng hóa</th><th>ĐVT</th><th class="num">${cols[0]}</th><th class="num">${cols[1]}</th><th class="num">Thành tiền</th>${d.type==='IV'?'<th class="num">Giá đơn mua</th><th class="num">Lệch %</th>':''}</tr></thead><tbody>
  ${d.items.map(it=>{const p=price(it);const v=d.type==='IV'?((it.price-it.poPrice)/it.poPrice*100):0;
    return `<tr><td>${esc(it.mat)} · ${esc(mat(it.mat).n)}</td><td>${esc(mat(it.mat).u)}</td><td class="num">${it.qty}</td><td class="num">${fm(p)}</td><td class="num">${fm(p*it.qty)}</td>${d.type==='IV'?`<td class="num">${fm(it.poPrice)}</td><td class="num" style="color:${Math.abs(v)>S.cfg.tol?'var(--bad)':'inherit'}">${v.toFixed(2)}</td>`:''}</tr>`;}).join('')}</tbody>
  ${d.net!=null?`<tfoot><tr><td colspan="4">Cộng tiền hàng / Thuế GTGT / Tổng</td><td class="num">${fm(d.net)} / ${fm(d.vat)} / ${fm(d.total)}</td>${d.type==='IV'?'<td></td><td></td>':''}</tr></tfoot>`:''}</table></div>`;
}
function jeTable(d){
  if(!Array.isArray(d.je)||!d.je.length||d.status==='rejected') return `<p class="small muted" style="margin:0">${d.status==='rejected'?'Chứng từ bị từ chối/hủy nên không có bút toán hiệu lực.':(d.type==='PAY'||d.type==='RC')&&d.status==='pending'?'Bút toán sẽ được ghi khi Kế toán trưởng duyệt.':'Chứng từ này không phát sinh bút toán kế toán (chứng từ nghiệp vụ).'}</p>`;
  return `<div class="tw"><table class="t"><thead><tr><th>Tài khoản</th><th>Tên tài khoản</th><th>Đối tượng</th><th class="num">Nợ</th><th class="num">Có</th></tr></thead><tbody>
  ${d.je.map(j=>`<tr><td class="mono">${esc(j.a)}</td><td>${esc(ACCS[j.a])}</td><td class="small">${esc(j.p||j.mat||'')}</td><td class="num">${j.dr?fm(j.dr):''}</td><td class="num">${j.cr?fm(j.cr):''}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="3">Cộng</td><td class="num">${fm(sum(d.je,j=>j.dr||0))}</td><td class="num">${fm(sum(d.je,j=>j.cr||0))}</td></tr></tfoot></table></div>`;
}
const ACTN = {create:'Lập chứng từ',approve:'Phê duyệt',reject:'Từ chối'};
function histList(d){ return `<ul class="hist">${(d.hist||[]).map(h=>`<li><time>${vdt(h.at)}</time><div><b>${esc(ACTN[h.act]||h.act)}</b>${h.self?' <span class="chip c-pending">tự duyệt do kiêm nhiệm</span>':''} — ${esc(nameOf(h.by))} <span class="small muted">(${esc(roleName(h.role))})</span>${h.note?`<div class="small">${esc(h.note)}</div>`:''}</div></li>`).join('')}</ul>`; }
function nextSteps(c,d){
  const b=[]; const B=(tc,p,l)=>{ if(allowed(tc)) b.push(`<button class="btn sm pri" data-go="${tc}" data-p="${P(p)}">${esc(l)} (${tc})</button>`); };
  if(d.type==='PR'&&c.Q.prForPO.includes(d)) B('ME21N',{pr:d.id},'Lập đơn mua');
  if(d.type==='PO'&&c.Q.poForGR.includes(d)) B('MIGO',{po:d.id},'Nhập kho');
  if(d.type==='PO'&&c.Q.poForIV.includes(d)) B('MIRO',{po:d.id},'Nhập hóa đơn');
  if(d.type==='IV'&&c.Q.ivForPay.includes(d)) B('F-53',{iv:d.id},'Đề nghị chi');
  if(d.type==='SO'&&c.Q.soForDL.includes(d)) B('VL01N',{so:d.id},'Xuất kho');
  if(d.type==='DL'&&c.Q.dlForBI.includes(d)) B('VF01',{dl:d.id},'Lập hóa đơn');
  if(d.type==='BI'&&c.Q.biForRC.includes(d)) B('F-28',{bi:d.id},'Thu tiền');
  return b.join('');
}

  const okL = {PR:'Phê duyệt',PO:'Phê duyệt đơn mua',IV:'Gỡ khóa thanh toán',SO:'Gỡ khóa tín dụng',PAY:'Duyệt chi',RC:'Duyệt thu'}[d.type];

  return `<div class="panel" style="border-color:var(--warn)"><h2>Phê duyệt</h2>${info}
   <form class="form" data-form="DECIDE" data-co="${esc(S.param.co)}" data-id="${esc(d.id)}" style="margin-top:12px"><div class="err"></div>
   <label class="field"><span>Ý kiến (bắt buộc khi từ chối)</span><input id="f-note" maxlength="200"></label>

}

function extraCell(u){
  if(!u.co||!u.role) return '<span class="muted">Phân công vai trò chính trước</span>';

function coWarnings(co, users){
  const mem = users.filter(u=>u.co===co&&u.role); const items=[];
  if(!mem.length) return {co,items};
  const holders = r => mem.filter(u=>userRoles(u).includes(r)||(r==='KTT'&&userGrants(u).includes('AP')));
  ROLE_ORDER.forEach(r=>{ if(!holders(r).length){
    const g = Object.keys(TYPE_ROLE).filter(t=>TYPE_ROLE[t]===r);
    const covered = r!=='KTT' && g.every(t=>mem.some(u=>userGrants(u).includes(t)));
    if(!covered) items.push(`Chưa ai giữ vai trò <b>${esc(ROLES[r].n)}</b>${r==='KTT'?' hoặc quyền phê duyệt':''}. Giao kiêm nhiệm cho một thành viên.`); } });
  const appr = holders('KTT');
  if(appr.length===1 && !S.cfg.selfApprove){ const a=appr[0]; const creates = ROLE_ORDER.filter(r=>r!=='KTT'&&userRoles(a).includes(r)).length || userGrants(a).some(x=>x!=='AP');
    if(creates) items.push(`<b>${esc(a.full_name)}</b> vừa là người duyệt duy nhất vừa lập chứng từ: chứng từ người này lập sẽ không ai duyệt được. Bật "Cho phép tự duyệt khi kiêm nhiệm" trong SPRO, hoặc giao thêm quyền phê duyệt cho người khác.`); }
  mem.forEach(u=>userConflicts(u).filter(x=>x.sc>=3&&!(x.a==='KTT'||x.b==='KTT')).forEach(x=>items.push(`<b>${esc(u.full_name)}</b> kiêm ${esc(roleName(x.a))} và ${esc(roleName(x.b))}: ${esc(conflictWhy(x.a,x.b))}. Nên đổi cách giao nếu nhóm đủ người.`)));
  return {co,items};
}

    const r=await createDoc(S.co,'SO',{status:blocked?'blocked':'approved',cust,custPo:val(f,'f-cpo'),date:val(f,'f-date'),need:val(f,'f-need'),items,net,vat,total,
      blockReason:blocked?'Vượt hạn mức tín dụng '+fm(e.tot+total-lim)+' đồng':''},blocked?'Kiểm tra tín dụng: vượt hạn mức':'Kiểm tra tín dụng: đạt');
    toast(blocked?'Đơn bán '+r.no+' bị KHÓA TÍN DỤNG, chờ Kế toán trưởng.':'Đơn bán '+r.no+' đã xác nhận, chuyển Thủ kho xuất hàng.'); go('DOC',{co:S.co,id:r.id}); }); },
  DL(f){ guard(f,async()=>{ const c=calc(S.co); const so=c.by[f.dataset.so]; const op=c.soOpen(so);
    if(so.status!=='approved') return setErr(f,'<b>Đơn bán chưa được xác nhận.</b>');
    const items=[...f.querySelectorAll('.dl-line')].map(tr=>{const i=+tr.dataset.i;return {line:i,mat:so.items[i].mat,qty:Math.round(num(tr.querySelector('.dl-qty').value))};}).filter(x=>x.qty>0);
    if(!items.length) return setErr(f,'<b>Chưa có số lượng xuất.</b>');
    for(const x of items){ if(x.qty>op[x.line]) return setErr(f,`<b>Xuất vượt đơn bán.</b> ${esc(x.mat)} chỉ còn ${op[x.line]}.`);
      if(x.qty>c.st[x.mat].q) return setErr(f,`<b>Không đủ tồn kho.</b> ${esc(x.mat)} chỉ còn ${c.st[x.mat].q} trong kho. Báo Thủ kho lập đề nghị mua (ME51N).`); }
    if(!val(f,'f-recv')) return setErr(f,'<b>Thiếu người nhận hàng.</b>');
    items.forEach(x=>{x.cost=Math.round(c.st[x.mat].avg*x.qty);});
    const cost=sum(items,x=>x.cost);
    const je=[{a:'632',dr:cost}].concat(items.map(x=>({a:'1561',cr:x.cost,mat:x.mat,q:x.qty})));
    const r=await createDoc(S.co,'DL',{status:'posted',so:so.id,cust:so.cust,date:val(f,'f-date'),receiver:val(f,'f-recv'),vehicle:val(f,'f-veh'),items,value:cost,je});
    toast('Đã ghi sổ phiếu xuất kho '+r.no+'.'); go('DOC',{co:S.co,id:r.id}); }); },
  BI(f){ guard(f,async()=>{ const c=calc(S.co); const dl=c.by[f.dataset.dl];
    if(c.kids('BI','dl',dl.id).length) return setErr(f,'<b>Phiếu xuất này đã được lập hóa đơn.</b>');
    const so=c.by[dl.so]; const items=dl.items.map(x=>({line:x.line,mat:x.mat,qty:x.qty,price:so.items[x.line].price}));
    const net=sum(items,x=>x.qty*x.price), vat=Math.round(net*VAT), total=net+vat;
    const seq=Math.max(0,...c.T.BI.map(d=>d.seq||0))+1;
    const je=[{a:'131',dr:total,p:dl.cust},{a:'5111',cr:net},{a:'33311',cr:vat}];
    const r=await createDoc(S.co,'BI',{status:'posted',dl:dl.id,so:so.id,cust:dl.cust,date:val(f,'f-date'),due:addDays(val(f,'f-date'),cus(dl.cust).terms),
      invSym:'1C'+YY+'T'+'ABCDEFGH'[COS.indexOf(S.co)]+'A',invNo:pad(seq,8),items,net,vat,total,je});
    toast('Đã phát hành hóa đơn '+r.no+'.'); go('DOC',{co:S.co,id:r.id}); }); },
  RC(f){ guard(f,async()=>{ const c=calc(S.co); const bi=c.by[f.dataset.bi]; const rem=bi.total-c.biPaid(bi)-c.biPend(bi); const amt=Math.round(num(val(f,'f-amt')));
    if(!(amt>0)||amt>rem+0.5) return setErr(f,`<b>Số tiền không hợp lệ.</b> Tối đa ${fm(rem)}.`);
    if(!val(f,'f-ref')) return setErr(f,'<b>Thiếu số giấy báo Có hoặc người nộp tiền.</b>');
    const r=await createDoc(S.co,'RC',{status:'pending',bi:bi.id,cust:bi.cust,date:val(f,'f-date'),acc:val(f,'f-acc'),amount:amt,ref:val(f,'f-ref'),memo:'Thu tiền hóa đơn '+bi.invSym+' số '+bi.invNo});
    toast('Đã gửi phiếu thu '+r.no+' cho Kế toán trưởng.'); go('DOC',{co:S.co,id:r.id}); }); },
  DECIDE(f,ev){ const ok = ev&&ev.submitter ? ev.submitter.value==='1' : true;
    guard(f,async()=>{ const co=f.dataset.co, id=f.dataset.id; const c=calc(co); const d=c.by[id]; const note=val(f,'f-note');
    if(!allowed('SBWP')) return setErr(f,'<b>Không có quyền phê duyệt.</b>');
    if(d.by===S.uid&&!S.isAdmin&&!S.cfg.selfApprove) return setErr(f,'<b>Vi phạm bất kiêm nhiệm.</b> Bạn không thể phê duyệt chứng từ do chính mình lập. Nếu nhóm không còn ai khác được duyệt, báo giảng viên bật "Cho phép tự duyệt khi kiêm nhiệm" trong SPRO.');
    if(!ok&&!note) return setErr(f,'<b>Hãy ghi lý do từ chối</b> để người lập biết cần sửa gì.');
    const t=now(); const patch={hist:(d.hist||[]).concat([{at:t,by:S.uid,role:S.role,act:ok?'approve':'reject',note}]),decBy:S.uid,decAt:t};
    if(!ok){ patch.status='rejected'; }
    else if(d.type==='PAY'){ if(c.bal(d.acc)<d.amount) return setErr(f,`<b>Không đủ số dư TK ${d.acc}.</b> Số dư ${fm(c.bal(d.acc))}.`);
      patch.status='posted'; patch.je=[{a:'331',dr:d.amount,p:d.vendor},{a:d.acc,cr:d.amount}]; }
    else if(d.type==='RC'){ patch.status='posted'; patch.je=[{a:d.acc,dr:d.amount},{a:'131',cr:d.amount,p:d.cust}]; }
    else if(d.type==='IV'){ patch.status='posted'; }
    else patch.status='approved';
    await api('erp_doc_decide',{p_token:S.token,p_co:co,p_id:id,p_ok:ok,p_note:note,p_act_role:S.isAdmin?S.role:''}); await sync(); toast(ok?'Đã phê duyệt '+d.no+'.':'Đã từ chối '+d.no+'.'); render(true,true); }); },
  EXTRA(f){ guard(f,async()=>{ const u=S.users[f.dataset.u]; if(!u) return;
    const ex=[...f.querySelectorAll('input[name="xr"]:checked,input[name="xg"]:checked')].map(i=>i.value);
    await api('erp_admin_assign',{p_token:S.token,p_rows:[{id:u.id,co:u.co,role:u.role,extra:ex}]}); S.editExtra=null; await sync(); toast('Đã lưu kiêm nhiệm cho '+u.full_name+'.'); render(true,true); }); },
  CFG(f){ guard(f,async()=>{ const cfg={tol:Math.max(0,num(val(f,'c-tol'))),poAuto:Math.max(0,num(val(f,'c-po'))),credit:val(f,'c-cr')==='1',selfApprove:val(f,'c-self')==='1'};
    await api('erp_admin_set_cfg',{p_token:S.token,p_cfg:cfg}); await sync(); toast('Đã lưu tham số.'); }); }
};

/* ============ ACTIONS ============ */
const ACT = {
  back(){ back(); },
  menu(){ document.getElementById('side').classList.toggle('open'); },
  addLine(a){ const tb=document.getElementById('lines'); if(tb.children.length>=MATS.length) return toast('Tối đa '+MATS.length+' dòng.'); tb.insertAdjacentHTML('beforeend',lineRow(a.dataset.kind,S.co)); const f=a.closest('form'); CALC[f.dataset.calc](f); },
  delLine(a){ const tb=document.getElementById('lines'); if(tb.children.length<=1) return; const f=a.closest('form'); a.closest('tr').remove(); CALC[f.dataset.calc](f); },
  viewCo(a){ LS.set('erp.co',a.dataset.co); S.co=a.dataset.co; S.sideKey=''; go('HOME'); },
  editExtra(a){ S.editExtra = S.editExtra===a.dataset.u ? null : a.dataset.u; render(true,true); },
  async autoAssign(){ const us=Object.values(S.users).filter(u=>!u.is_admin);
    const todo=us.filter(u=>!u.co||!u.role); if(!todo.length) return toast('Không còn sinh viên chờ phân công.');
    const mem={}; COS.forEach(c=>mem[c]=us.filter(u=>u.co&&u.role&&u.co===c).map(u=>({id:u.id,role:u.role,extra:(u.extra||[]).slice(),old:true})));
    todo.sort((a,b)=>String(a.username).localeCompare(String(b.username))).forEach(u=>{ let co=u.grp&&COS[u.grp-1]?COS[u.grp-1]:null;
      if(!co||mem[co].length>=5) co=COS.slice().sort((a,b)=>mem[a].length-mem[b].length)[0];
      mem[co].push({id:u.id,role:null,extra:[],old:false}); });
    const FILL=['KHO','KT','KTT','MH','KD']; const rows=[];
    COS.forEach(co=>{ const m=mem[co]; if(!m.some(x=>!x.old)) return;
      m.filter(x=>!x.old).forEach(x=>{ const held=new Set(m.filter(y=>y.role).map(y=>y.role)); x.role=FILL.find(r=>!held.has(r))||FILL.find(r=>true); });
      m.forEach(y=>{ const k=y.extra.filter(e=>e.startsWith('T:')); if(k.length!==y.extra.length){ y.extra=k; y.touched=true; } });
      if(m.length<5){ const held=new Set(); m.forEach(y=>{held.add(y.role); y.extra.forEach(e=>held.add(e));});
        FILL.filter(r=>!held.has(r)).forEach(r=>{ const cand=m.filter(y=>!(m.length>=3&&y.role==='KTT'));
          const score=y=>{const rs=[y.role].concat(y.extra.filter(e=>ROLES[e])); return sum(rs,q=>conflictOf(q,r))+1.5*rs.length;};
          const pick=(cand.length?cand:m).slice().sort((a,b)=>score(a)-score(b))[0]; pick.extra.push(r); pick.touched=true; }); }
      m.forEach(x=>{ if(!x.old||x.touched) rows.push({id:x.id,co,role:x.role,extra:x.extra}); }); });
    try{ await api('erp_admin_assign',{p_token:S.token,p_rows:rows}); await sync(); toast('Đã phân công '+todo.length+' sinh viên. Nhóm thiếu người đã được giao kiêm nhiệm.'); render(true,true);}catch(e){ toast(dbErr(e)); } },
  async rotate(a){ if(a.dataset.sure!=='1'){ a.dataset.sure='1'; a.textContent='Bấm lần nữa để xoay vòng'; setTimeout(()=>{a.dataset.sure='';a.textContent='Xoay vòng vai trò';},4000); return; }
    const rows=[];
    COS.forEach(co=>{ const m=Object.values(S.users).filter(u=>!u.is_admin&&u.co===co&&u.role).sort((x,y)=>ROLE_ORDER.indexOf(x.role)-ROLE_ORDER.indexOf(y.role));
      m.forEach((u,i)=>{ const nx=m[(i+1)%m.length]; rows.push({id:u.id,co,role:nx.role,extra:(nx.extra||[]).slice()}); }); });
    try{ await api('erp_admin_assign',{p_token:S.token,p_rows:rows}); await sync(); toast('Đã xoay vòng: mỗi bạn nhận phần việc (cả kiêm nhiệm) của bạn kế tiếp trong nhóm.'); render(true,true);}catch(e){ toast(dbErr(e)); } },
  async resetPw(a){ if(a.dataset.sure!=='1'){ a.dataset.sure='1'; a.textContent='Xác nhận?'; setTimeout(()=>{a.dataset.sure='';a.textContent='Cấp lại MK';},4000); return; }
    try{ const r=await api('erp_admin_reset_pw',{p_token:S.token,p_user:a.dataset.u}); S.lastPw=[r]; await sync(); render(true,true); toast('Đã cấp lại mật khẩu cho '+r.mssv+'.'); }catch(e){ toast(dbErr(e)); } },
  async delUser(a){ if(a.dataset.sure!=='1'){ a.dataset.sure='1'; a.textContent='Xóa thật?'; setTimeout(()=>{a.dataset.sure='';a.textContent='Xóa';},4000); return; }
    try{ await api('erp_admin_delete_user',{p_token:S.token,p_user:a.dataset.u}); await sync(); render(true,true); toast('Đã xóa tài khoản.'); }catch(e){ toast(dbErr(e)); } },
  dlPw(){ const rows=[['MSSV','Ho ten','Mat khau']].concat((S.lastPw||[]).map(x=>[x.mssv,x.name,x.password]));
    const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.getElementById('dl'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='erp-mat-khau-'+today()+'.csv'; a.click(); },
  async copyPw(){ const t=(S.lastPw||[]).map(x=>[x.mssv,x.name,x.password].join('\t')).join('\n'); try{ await navigator.clipboard.writeText(t); toast('Đã chép bảng mật khẩu.'); }catch(e){ toast('Không chép được, hãy dùng nút Tải CSV.'); } },
  clearPw(){ S.lastPw=null; render(true,true); },
  logout(){ logout(); },
  peekCase(){ S.peek=scrCase; render(true,true); },
  peekPfcg(){ S.peek=scrPFCG; render(true,true); },
  resetAsk(){ const co=document.getElementById('c-reset').value; document.getElementById('reset-confirm').innerHTML=`<button class="btn sm badb" data-act="resetDo" data-co="${co}">Xác nhận xóa toàn bộ chứng từ ${co}</button>`; },
  async resetDo(a){ const co=a.dataset.co; a.disabled=true; try{ const n=await api('erp_admin_reset_co',{p_token:S.token,p_co:co}); await sync(true); toast('Đã xóa '+n+' chứng từ của '+co+'.'); render(true); }catch(e){ toast(dbErr(e)); a.disabled=false; } }
};
const CHG = {
  co(s){ LS.set('erp.co',s.value); S.sideKey=''; render(true); },
  role(s){ LS.set('erp.role',s.value); S.sideKey=''; render(true); },
  linemat(s){ const tr=s.closest('tr'); const p=tr.querySelector('.li-price'); if(p) p.value=mat(s.value).sp; const f=s.closest('form'); CALC[f.dataset.calc](f); },
  povendor(s){ const v=ven(s.value); const f=s.closest('form'); f.querySelectorAll('#polines tr').forEach(tr=>{tr.querySelector('.po-price').value=Math.round(mat(tr.dataset.mat).bp*v.f);}); CALC.PO(f); },
  socust(s){ CALC.SO(s.closest('form')); },
  async asgCo(s){ const u=S.users[s.dataset.u]||{}; const co=s.value||null; const role=co?(u.role||'KHO'):null;
    try{ await api('erp_admin_assign',{p_token:S.token,p_rows:[{id:s.dataset.u,co,role}]}); await sync(); render(true,true);}catch(e){toast(dbErr(e));} },
  async asgRole(s){ const u=S.users[s.dataset.u]||{}; const role=s.value||null; const co=role?(u.co||(u.grp&&COS[u.grp-1])||'C01'):u.co;
    try{ await api('erp_admin_assign',{p_token:S.token,p_rows:[{id:s.dataset.u,co,role}]}); await sync(); render(true,true);}catch(e){toast(dbErr(e));} }
};

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); let p=null; try{p=g.dataset.p?JSON.parse(g.dataset.p):null;}catch(x){} go(g.dataset.go,p); return; }
  const a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a,e); }
});
document.addEventListener('submit',e=>{ const f=e.target.closest('form[data-form]'); if(f){ e.preventDefault(); FORM[f.dataset.form](f,e); } });
document.addEventListener('input',e=>{ const f=e.target.closest('form[data-calc]'); if(f&&CALC[f.dataset.calc]) CALC[f.dataset.calc](f);
  if(e.target.id==='i-rows'){ const n=parseRoster(e.target.value).length; document.getElementById('i-preview').textContent=n?n+' dòng hợp lệ':''; } });
document.addEventListener('change',e=>{ const s=e.target.closest('[data-chg]'); if(s&&CHG[s.dataset.chg]) CHG[s.dataset.chg](s); });
document.getElementById('cmdform').addEventListener('submit',e=>{ e.preventDefault(); const i=document.getElementById('cmd'); let v=i.value.trim().toUpperCase().replace(/^\/[NO]\s*/,''); i.value=''; if(v) go(v); });

/* ============ BOOT ============ */
function parseRoster(t){
  return String(t||'').split(/\r?\n/).map(l=>l.split(/\t|;|,/).map(x=>x.trim())).filter(c=>c[0]&&c[1]&&/^[A-Za-z0-9._-]{3,30}$/.test(c[0]))
    .map(c=>({mssv:c[0],name:c[1],grp:/^[1-8]$/.test(c[2]||'')?c[2]:''}));
}
async function start(){
  document.getElementById('main').innerHTML='<div class="boot">Đang tải dữ liệu…</div>';
  try{ await sync(true); }
  catch(e){ if(e.code==='28000'){ logout(); return; } showLogin(dbErr(e)); return; }
  S.screen='HOME'; S.param=null; S.stack=[];
  render(true); startPolling();
}
(function boot(){
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||/YOUR|DIEN_/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)){ showSetup(); return; }
  S.token=LS.get('erp.token');
  if(S.token) start(); else showLogin();
})();
</script>
